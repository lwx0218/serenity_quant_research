name: Document Governance

on:
  pull_request:
  push:
    branches:
      - main
      - product-reboot

jobs:
  document-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check document governance
        run: python3 scripts/check-document-governance.py --check
